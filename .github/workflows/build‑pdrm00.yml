name: Build pdrm00 SM8250-4.19 KernelSU-Next (Debug)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支（留空=自动探测）
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup logs directory
        run: |
          mkdir -p ${{ github.workspace }}/logs
          echo "Workflow 启动时间: $(date -u)" > ${{ github.workspace }}/logs/summary.log

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils

      - name: Probe remote branches
        run: |
          LOG=${{ github.workspace }}/logs/branches.log
          echo "=== 仓库远程分支 ===" | tee $LOG
          git ls-remote --heads ${{ env.KERNEL_REPO }} 2>&1 | tee -a $LOG

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00
          restore-keys: ccache-pdrm00

      - name: Download toolchain (proton-clang)
        run: |
          LOG=${{ github.workspace }}/logs/toolchain.log
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang 2>&1 | tee $LOG
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version 2>&1 | tee -a $LOG

      - name: Clone kernel source
        run: |
          LOG=${{ github.workspace }}/logs/clone.log
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1 2>&1 | tee $LOG
          echo "=== 源码树结构 ===" | tee -a $LOG
          ls -la kernel/ | tee -a $LOG
          find kernel/arch/arm64/configs -name '*defconfig*' 2>&1 | tee -a $LOG

      - name: Locate defconfig
        run: |
          LOG=${{ github.workspace }}/logs/defconfig.log
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
            echo "✓ 找到: arch/arm64/configs/$DEFCONFIG_INPUT" | tee $LOG
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
            echo "✓ 找到: arch/arm64/configs/vendor/$DEFCONFIG_INPUT" | tee $LOG
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT" | tee $LOG
            exit 1
          fi

      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          LOG=${{ github.workspace }}/logs/ksunext.log
          cd kernel
          echo "=== 集成 KernelSU-Next ===" | tee $LOG
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy 2>&1 | tee -a $LOG
          ls -la drivers/kernelsu/ 2>&1 | tee -a $LOG

      - name: Patch defconfig for Manual Hooks
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          LOG=${{ github.workspace }}/logs/patch_defconfig.log
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          echo "=== 注入 Manual Hooks 配置到 $DEFCONFIG_FILE ===" | tee $LOG
          {
            echo ""
            echo "# KernelSU-Next Manual Hooks (added by CI)"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KSU_KPROBES_HOOK is not set"
          } >> "$DEFCONFIG_FILE"
          echo "=== 追加后文件末尾 ===" | tee -a $LOG
          tail -20 "$DEFCONFIG_FILE" | tee -a $LOG

      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          LOG=${{ github.workspace }}/logs/compile.log
          cd kernel
          export PATH="$CLANG_PATH:$PATH"

          echo "===== [1/3] mrproper =====" | tee $LOG
          make O=out ARCH=arm64 CC="ccache clang" mrproper 2>&1 | tee -a $LOG || { echo "mrproper 失败"; exit 1; }

          echo "===== [2/3] defconfig: ${{ env.DEFCONFIG }} =====" | tee -a $LOG
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 | tee -a $LOG || {
            echo "❌ defconfig 步骤失败" | tee -a $LOG; exit 1;
          }

          echo "=== 确认 Manual Hooks 配置生效 ===" | tee -a $LOG
          grep -E "KSU|KPROBES" out/.config | tee -a $LOG

          echo "===== [3/3] 编译内核 =====" | tee -a $LOG
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tee -a $LOG
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ 内核编译失败 (exit=$STATUS)" | tee -a $LOG
            exit 1
          fi
          echo "✓ 内核编译成功" | tee -a $LOG

      # ======== 新增：编译失败时直接输出日志到控制台 ========
      - name: Print compile log on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "============================================================"
          echo "  编译失败，以下是 compile.log 最后 300 行："
          echo "============================================================"
          tail -300 ${{ github.workspace }}/logs/compile.log
          echo "============================================================"
          echo "  日志结束"
          echo "============================================================"
          exit 1

      - name: Collect artifacts (diagnostic)
        if: always()
        run: |
          LOG=${{ github.workspace }}/logs/artifacts.log
          echo "=== 编译产物路径检查 ===" | tee $LOG
          ls -la kernel/out/arch/arm64/boot/ 2>&1 | tee -a $LOG
          find kernel/out -name '*.dtb' 2>&1 | tee -a $LOG
          find kernel/out -name '*.dtbo' 2>&1 | tee -a $LOG

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
