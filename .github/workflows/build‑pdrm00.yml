name: Build pdrm00 SM8250-4.19 KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true
      KSU_HOOK_MODE:
        description: KSU hook 模式
        required: true
        type: choice
        options:
          - kprobes
          - manual
        default: kprobes

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils patch

      # ── Clang 工具链 ─────────────────────────────────────
      - name: Download AOSP Clang
        run: |
          set -e
          URL1="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr1-s2-release/clang-r450784e.tar.gz"
          URL2="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20240212-release/Clang-14.0.6-20240212.tar.gz"
          echo "=== 尝试官方源 ==="
          if ! wget -q "$URL1" -O clang.tar.gz; then
            echo "=== 官方源失败，切换到 GitHub 备用源 ==="
            wget -q "$URL2" -O clang.tar.gz
          fi
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00
          restore-keys: ccache-pdrm00-

      - name: Clone kernel source
        run: |
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1
          ls -la kernel/arch/arm64/configs/vendor/ | head -20

      - name: Locate defconfig
        run: |
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT"
            find kernel/arch/arm64/configs -name '*defconfig*'
            exit 1
          fi
          echo "✓ defconfig: $DEFCONFIG"

      # ── KernelSU-Next ───────────────────────────────────
      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "=== drivers/kernelsu 内容 ==="
          ls -la drivers/kernelsu/ | head -10

      # ── 一次注入所有 defconfig 修复 ─────────────────────
      - name: Patch defconfig (KSU + LSE)
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          {
            echo ""
            echo "# ===== CI 注入的配置 ====="
            echo "# KernelSU-Next"
            echo "CONFIG_KSU=y"
            if [ "${{ github.event.inputs.KSU_HOOK_MODE }}" = "kprobes" ]; then
              echo "CONFIG_KSU_KPROBES_HOOK=y"
            else
              echo "CONFIG_KSU_MANUAL_HOOK=y"
            fi
            echo "# 关闭 LSE atomics（clang 13 + 4.19 内核不兼容）"
            echo "# CONFIG_ARM64_LSE_ATOMICS is not set"
          } >> "$DEFCONFIG_FILE"
          echo "=== 追加后的文件末尾 ==="
          tail -15 "$DEFCONFIG_FILE"

      # ── 编译 ────────────────────────────────────────────
      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          LOG=${{ github.workspace }}/compile.log

          echo "===== [1/3] 清理 out =====" | tee $LOG
          rm -rf out

          echo "===== [2/3] defconfig =====" | tee -a $LOG
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 | tee -a $LOG || {
            echo "❌ defconfig 失败"; exit 1;
          }

          echo "=== 关键配置确认 ===" | tee -a $LOG
          grep -E "KSU|LSE_ATOMICS|KPROBES" out/.config | tee -a $LOG

          echo "===== [3/3] 编译内核 =====" | tee -a $LOG
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tee -a $LOG
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ 编译失败 (exit=$STATUS)" | tee -a $LOG
            exit 1
          fi
          echo "✓ 编译成功" | tee -a $LOG

      # ── 失败时输出所有诊断信息 ─────────────────────────
      - name: Print all diagnostics on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "############################################################"
          echo "#                                                          #"
          echo "#   编译失败。以下是所有诊断信息，请全部复制给我。          #"
          echo "#                                                          #"
          echo "############################################################"
          echo ""
          echo "============================================================"
          echo "  [1/5] 编译日志最后 500 行"
          echo "============================================================"
          tail -500 ${{ github.workspace }}/compile.log || true
          echo ""
          echo "============================================================"
          echo "  [2/5] 检查 KernelSU-Next 钩子状态"
          echo "============================================================"
          cd kernel
          echo "--- fs/exec.c 中的 ksu_handle ---"
          grep -n "ksu_handle" fs/exec.c 2>/dev/null || echo "  (无)"
          echo "--- kernel/reboot.c 中的 ksu_handle ---"
          grep -n "ksu_handle" kernel/reboot.c 2>/dev/null || echo "  (无)"
          echo ""
          echo "--- Kbuild:171 上下文 ---"
          sed -n '160,180p' drivers/kernelsu/Kbuild
          echo ""
          echo "============================================================"
          echo "  [3/5] 检查 .config 中的 KSU / LSE 配置"
          echo "============================================================"
          grep -E "KSU|LSE_ATOMICS|KPROBES|ARM64_LSE" out/.config 2>/dev/null || echo "  (.config 不存在)"
          echo ""
          echo "============================================================"
          echo "  [4/5] LSE atomic 相关源文件是否存在"
          echo "============================================================"
          ls -la arch/arm64/include/asm/atomic_lse.h arch/arm64/include/asm/atomic_ll_sc.h 2>&1 || true
          echo ""
          echo "============================================================"
          echo "  [5/5] Kbuild 检查哪一项失败"
          echo "============================================================"
          grep -n "KSU_MANUAL_HOOK\|KSU_KPROBES_HOOK\|No hooks" drivers/kernelsu/Kbuild 2>/dev/null || echo "  (未找到)"
          echo ""
          echo "############################################################"
          echo "#   诊断结束"
          echo "############################################################"
          exit 1

      # ── 打包 ────────────────────────────────────────────
      - name: Collect artifacts (diagnostic)
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/ 2>&1 || true
          find kernel/out -name '*.dtb' 2>&1 | head -20 || true
          find kernel/out -name '*.dtbo' 2>&1 | head -20 || true

      - name: Package AnyKernel3
        if: steps.compile.outcome == 'success'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=kebab
          device.name2=instantnoodle
          device.name3=instantnoodlep
          supported.versions=
          supported.patchlevels=
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          EOF
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          mkdir -p AnyKernel3/dtb
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} AnyKernel3/dtb/ \;
          cd AnyKernel3 && zip -r9 ../AnyKernel3-pdrm00.zip . -x '*.git*'

      - name: Upload AnyKernel3 zip
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-pdrm00
          path: AnyKernel3-pdrm00.zip
          if-no-files-found: error

      - name: Upload raw Image
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-Image-pdrm00
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
