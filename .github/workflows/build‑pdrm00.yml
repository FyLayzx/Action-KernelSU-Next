name: Build pdrm00 SM8250-4.19 KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: true
        default: main
      KERNEL_CONFIG:
        description: defconfig 名称（高通 4.19 通常在 vendor/ 下）
        required: true
        default: vendor/pdrm00_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache

      # ── 工具链 ─────────────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00-${{ github.sha }}
          restore-keys: |
            ccache-pdrm00-

      - name: Download clang-r450784e
        run: |
          git clone https://github.com/ZyCromerZ/Clang \
            --depth=1 --branch clang-r450784e clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"

      # ── 源码 ─────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          git clone https://github.com/FyLayzx/kernel_oneplus_sm8250 kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1

      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      # ── 编译 ─────────────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          export PATH="$CLANG_PATH:$PATH"
          make O=out ARCH=arm64 CC="ccache clang" mrproper
          make O=out ARCH=arm64 CC="ccache clang" \
            ${{ github.event.inputs.KERNEL_CONFIG }}
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1

      # ── 打包 AnyKernel3（boot 分区） ─────────────────────
      - name: Clone and prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OnePlus8T
          device.name2=OnePlus8
          device.name3=kebab
          device.name4=instantnoodle
          device.name5=instantnoodlep
          supported.versions=
          supported.patchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_MOUNT_POINT=/;
          EOF

      - name: Copy kernel artifacts into AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          mkdir -p AnyKernel3/dtb
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} AnyKernel3/dtb/ \;
          echo "=== AnyKernel3 内容 ==="
          ls -la AnyKernel3/
          echo "=== dtb 数量 ==="
          ls -la AnyKernel3/dtb/ | head

      - name: Package AnyKernel3 zip
        run: |
          cd AnyKernel3
          zip -r9 ../AnyKernel3-pdrm00.zip . -x '*.git*'

      # ── 打包 dtbo（独立镜像） ────────────────────────────
      - name: Collect dtbo image
        run: |
          mkdir -p dtbo-out
          # 4.19 高通内核通常生成 dtbo.img 到 out/arch/arm64/boot/
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img dtbo-out/
            echo "✓ 找到 dtbo.img"
          else
            echo "✗ 未找到 dtbo.img，尝试从 dts 目录构建路径查找..."
            find kernel/out -name 'dtbo.img' -exec cp {} dtbo-out/ \; || true
          fi
          ls -la dtbo-out/

      - name: Package dtbo zip
        run: |
          cd dtbo-out
          if [ -f dtbo.img ]; then
            zip -r9 ../dtbo-pdrm00.zip dtbo.img
            echo "✓ dtbo-pdrm00.zip 已生成"
          else
            echo "⚠ 无 dtbo.img，跳过打包"
          fi

      # ── 上传 ─────────────────────────────────────────────
      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-pdrm00
          path: AnyKernel3-pdrm00.zip
          if-no-files-found: error

      - name: Upload dtbo zip
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-pdrm00
          path: dtbo-pdrm00.zip
          if-no-files-found: warn

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: raw-Image-pdrm00
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
