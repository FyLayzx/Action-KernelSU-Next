name: Build pdrm00 SM8250-4.19 KernelSU-Next-v6

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检查工作流版本
        run: |
          echo "============================================================"
          echo "  工作流版本: v6 (宏定义版)"
          echo "  如果你没看到这行 v6 字样，说明文件没替换成新版！"
          echo "============================================================"

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils patch

      - name: Download AOSP Clang
        run: |
          set -e
          URL1="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr1-s2-release/clang-r450784e.tar.gz"
          URL2="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20240212-release/Clang-14.0.6-20240212.tar.gz"
          if ! wget -q "$URL1" -O clang.tar.gz; then
            wget -q "$URL2" -O clang.tar.gz
          fi
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00
          restore-keys: ccache-pdrm00-

      - name: Clone kernel source
        run: |
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1

      - name: Locate defconfig
        run: |
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT"
            exit 1
          fi
          echo "✓ defconfig: $DEFCONFIG"

      # ============================================================
      # KernelSU-Next 集成
      # ============================================================
      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      # ============================================================
      # v6 修复：用宏定义代替 sed 替换（100% 可靠）
      # ============================================================
      - name: Fix 4.19 compatibility (宏定义版)
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel

          echo "============================================================"
          echo "  修复 4.19 兼容性 (v6 宏定义版)"
          echo "============================================================"

          # 找到 hook_manager.c 的实际路径
          HOOK_FILE=$(find -L . -name 'hook_manager.c' 2>/dev/null | head -1)
          COMPAT_FILE=$(find -L . -name 'kernel_compat.h' 2>/dev/null | head -1)

          echo "hook_manager.c: $HOOK_FILE"
          echo "kernel_compat.h: $COMPAT_FILE"
          echo ""

          # ------------------------------------------------------------
          # 修复 A: 用宏定义处理 register_trace_prio_sys_enter
          #         在 hook_manager.c 开头插入宏，让它编译时自动改名
          # ------------------------------------------------------------
          if [ -n "$HOOK_FILE" ] && [ -f "$HOOK_FILE" ]; then
            echo "--- 修复 hook_manager.c ---"

            # 检查是否已经修复过
            if grep -q "KSU_419_TRACE_COMPAT" "$HOOK_FILE"; then
              echo "已修复，跳过"
            else
              # 创建宏定义块，插入到文件开头
              TMPFILE=$(mktemp)
              cat > "$TMPFILE" <<'MACROEOF'
/* ===== KSU_419_TRACE_COMPAT: 4.19 兼容宏 ===== */
/* 4.19 内核没有 prio 版本，且 trace_sys_enter 只接受 2 个参数 */
#ifndef register_trace_prio_sys_enter
#define register_trace_prio_sys_enter(probe, data, prio) register_trace_sys_enter(probe, data)
#endif
#ifndef unregister_trace_prio_sys_enter
#define unregister_trace_prio_sys_enter(probe, data, prio) unregister_trace_sys_enter(probe, data)
#endif
/* ===== KSU_419_TRACE_COMPAT END ===== */

MACROEOF

              cat "$TMPFILE" "$HOOK_FILE" > "$HOOK_FILE.new"
              mv "$HOOK_FILE.new" "$HOOK_FILE"
              rm -f "$TMPFILE"

              echo "✓ 宏定义已插入到 hook_manager.c 开头"
            fi

            # 验证
            echo "--- 验证插入结果（前 15 行）---"
            head -15 "$HOOK_FILE"
          else
            echo "⚠ 未找到 hook_manager.c"
          fi
          echo ""

          # ------------------------------------------------------------
          # 修复 B: strscpy_pad 版本门槛
          # ------------------------------------------------------------
          if [ -n "$COMPAT_FILE" ] && [ -f "$COMPAT_FILE" ]; then
            echo "--- 修复 kernel_compat.h ---"
            echo "修复前："
            grep -n "KERNEL_VERSION(4, 14, 222)" "$COMPAT_FILE" | head -3

            sed -i 's/KERNEL_VERSION(4, 14, 222)/KERNEL_VERSION(99, 99, 99)/g' "$COMPAT_FILE"

            echo "修复后："
            grep -n "KERNEL_VERSION(99, 99, 99)" "$COMPAT_FILE" | head -3

            if grep -q "KERNEL_VERSION(4, 14, 222)" "$COMPAT_FILE"; then
              echo "❌ 修复失败，还有残留"
              exit 1
            fi
            echo "✓ strscpy_pad 修复完成"
          fi
          echo ""
          echo "============================================================"
          echo "  所有修复完成"
          echo "============================================================"

      # ── 注入 defconfig ────────────────────────────────────
      - name: Patch defconfig
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          {
            echo ""
            echo "# ===== CI 注入 ====="
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBES_HOOK=y"
            echo "# CONFIG_ARM64_LSE_ATOMICS is not set"
          } >> "$DEFCONFIG_FILE"

      # ── 编译 ─────────────────────────────────────────────
      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          LOG=${{ github.workspace }}/compile.log

          rm -rf out
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 | tee $LOG || exit 1
          make O=out ARCH=arm64 -j$(nproc) CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tee -a $LOG
          STATUS=${PIPESTATUS[0]}
          [ $STATUS -ne 0 ] && { echo "❌ 编译失败 (exit=$STATUS)"; exit 1; }
          echo "✓ 编译成功"

      - name: Print errors on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "============================================================"
          echo "  编译失败 (工作流 v6)"
          echo "============================================================"
          echo ""
          echo "=== 所有 error 行（前 30 条）==="
          grep -i "error:" ${{ github.workspace }}/compile.log | head -30 || echo "(无)"
          echo ""
          echo "=== 编译日志最后 100 行 ==="
          tail -100 ${{ github.workspace }}/compile.log || true
          exit 1

      # ============================================================
      # 打包 AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        if: steps.compile.outcome == 'success'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cd AnyKernel3
          rm -rf .git .github modules patch ramdisk

          gzip -9 -c ../kernel/out/arch/arm64/boot/Image > Image.gz

          cat > anykernel.sh <<'AKEOF'
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

properties() { '
kernel.string=pdrm00 KernelSU-Next by CI
do.devicecheck=0
do.modules=0
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
supported.versions=
supported.patchlevels=
'; }

block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

. tools/ak3-core.sh;

dump_boot;
vbmeta_disable_verification;
write_boot;
AKEOF

          cd ..
          zip -r9 AnyKernel3-pdrm00.zip AnyKernel3 -x '*.git*'

      - name: Upload AnyKernel3 zip
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-pdrm00
          path: AnyKernel3-pdrm00.zip
          if-no-files-found: error

      - name: Upload raw Image
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-Image-pdrm00
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
