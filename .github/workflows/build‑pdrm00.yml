name: Build pdrm00 SM8250-4.19 KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250
  CLANG_VERSION: clang-r450784e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils patch

      # ── 下载 AOSP Clang ─────────────────────────────────
      - name: Download AOSP Clang
        run: |
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-13.0.0_r3/${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          if [ ! -s clang.tar.gz ]; then
            echo "⚠ 官方源失败，尝试 GitHub 备用源"
            wget -q "https://github.com/ZyCromerZ/Clang/releases/download/${{ env.CLANG_VERSION }}/${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          fi
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00-${{ env.CLANG_VERSION }}
          restore-keys: ccache-pdrm00-

      # ── Clone 源码 ─────────────────────────────────────
      - name: Clone kernel source
        run: |
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1
          ls -la kernel/arch/arm64/configs/vendor/ | head -20

      - name: Locate defconfig
        run: |
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT"
            find kernel/arch/arm64/configs -name '*defconfig*'
            exit 1
          fi
          echo "✓ 使用 defconfig: $DEFCONFIG"

      # ── KernelSU-Next 集成 ─────────────────────────────
      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          ls -la drivers/kernelsu/ | head -10

      - name: Patch defconfig for Manual Hooks
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          {
            echo ""
            echo "# KernelSU-Next Manual Hooks (CI added)"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
          } >> "$DEFCONFIG_FILE"
          tail -5 "$DEFCONFIG_FILE"

      # ── 编译 ───────────────────────────────────────────
      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"

          echo "===== [1/3] 清理 out 目录 ====="
          rm -rf out

          echo "===== [2/3] defconfig: ${{ env.DEFCONFIG }} ====="
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 || {
            echo "❌ defconfig 失败"; exit 1;
          }

          echo "=== 确认 KSU 配置 ==="
          grep -E "KSU|KPROBES" out/.config || echo "⚠ 未找到 KSU 配置"

          echo "===== [3/3] 编译内核 ====="
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ 内核编译失败 (exit=$STATUS)"
            exit 1
          fi
          echo "✓ 内核编译成功"

      # ── 失败时打印日志 ─────────────────────────────────
      - name: Print compile error if failed
        if: steps.compile.outcome == 'failure'
        run: |
          echo "============================================================"
          echo "  编译失败，完整错误如下（请复制给我）："
          echo "============================================================"
          cd kernel
          # 重新跑一次 make 拿最新错误（不 -j，方便看上下文）
          make O=out ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tail -200
          echo "============================================================"
          echo "  mainline hook 缺失检查："
          grep -n "ksu_handle" fs/exec.c kernel/reboot.c 2>/dev/null || echo "  （fs/exec.c / kernel/reboot.c 中无 ksu_handle）"
          echo "============================================================"
          exit 1

      # ── 上传产物 ───────────────────────────────────────
      - name: Collect artifacts
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/ 2>&1 || true
          find kernel/out -name '*.dtb' 2>&1 | head -20 || true
          find kernel/out -name '*.dtbo' 2>&1 | head -20 || true

      - name: Package AnyKernel3
        if: steps.compile.outcome == 'success'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=kebab
          device.name2=instantnoodle
          device.name3=instantnoodlep
          supported.versions=
          supported.patchlevels=
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          EOF
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          mkdir -p AnyKernel3/dtb
          find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} AnyKernel3/dtb/ \;
          cd AnyKernel3 && zip -r9 ../AnyKernel3-pdrm00.zip . -x '*.git*'

      - name: Upload AnyKernel3 zip
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-pdrm00
          path: AnyKernel3-pdrm00.zip
          if-no-files-found: error

      - name: Upload raw Image
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-Image-pdrm00
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
