name: Build pdrm00 SM8250-4.19 KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils patch

      # ── Clang ────────────────────────────────────────────
      - name: Download AOSP Clang
        run: |
          set -e
          URL1="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr1-s2-release/clang-r450784e.tar.gz"
          URL2="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20240212-release/Clang-14.0.6-20240212.tar.gz"
          if ! wget -q "$URL1" -O clang.tar.gz; then
            echo "官方源失败，切换备用源"
            wget -q "$URL2" -O clang.tar.gz
          fi
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00
          restore-keys: ccache-pdrm00-

      - name: Clone kernel source
        run: |
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1

      - name: Locate defconfig
        run: |
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT"
            find kernel/arch/arm64/configs -name '*defconfig*'
            exit 1
          fi
          echo "✓ defconfig: $DEFCONFIG"

      # ── KernelSU-Next 集成 ────────────────────────────────
      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo ""
          echo "=== kernel/KernelSU-Next 目录 ==="
          ls -la KernelSU-Next/ 2>&1 | head -20
          echo ""
          echo "=== drivers/kernelsu 目录 ==="
          ls -la drivers/kernelsu/ 2>&1 | head -20

      # ── 修复 strscpy_pad（稳健版）──────────────────────
      - name: Fix strscpy_pad compatibility
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          echo "############################################################"
          echo "# 修复前：搜索所有含 strscpy_pad 的文件"
          echo "############################################################"

          # 同时搜索两个可能的位置
          SEARCH_DIRS="drivers/kernelsu KernelSU-Next"
          FILES=""
          for d in $SEARCH_DIRS; do
            if [ -d "$d" ]; then
              FOUND=$(grep -rl "strscpy_pad" "$d" 2>/dev/null || true)
              if [ -n "$FOUND" ]; then
                FILES="$FILES $FOUND"
                echo "--- 在 $d 中找到 ---"
                echo "$FOUND"
              fi
            fi
          done

          if [ -z "$FILES" ]; then
            echo "⚠ 未找到含 strscpy_pad 的文件"
            echo "可能原因：KernelSU-Next 版本已自带兼容处理，跳过修复"
          else
            echo ""
            echo "############################################################"
            echo "# 需要修复的文件列表"
            echo "############################################################"
            echo "$FILES"
            echo ""

            # 步骤 1：注释掉 KernelSU-Next 自定义的 __strscpy_pad 函数
            echo "=== 步骤 1：注释掉自定义 __strscpy_pad ==="
            for f in $FILES; do
              # 找到函数定义范围
              if grep -q "static inline ssize_t __strscpy_pad" "$f"; then
                sed -i '/static inline ssize_t __strscpy_pad/,/^}/ s/^/\/\/ KSU-CI-DISABLED: /' "$f"
                echo "  ✓ 已注释 $f 中的 __strscpy_pad"
              fi
            done

            # 步骤 2：把 strscpy_pad 替换为 __strscpy_pad
            echo "=== 步骤 2：替换 strscpy_pad → __strscpy_pad ==="
            echo "$FILES" | while read f; do
              if [ -f "$f" ]; then
                sed -i 's/\bstrscpy_pad\b/__strscpy_pad/g' "$f"
                echo "  ✓ 已替换 $f"
              fi
            done
          fi

          echo ""
          echo "############################################################"
          echo "# 修复后：剩余 strscpy_pad 引用"
          echo "############################################################"
          grep -rn "strscpy_pad" drivers/kernelsu/ 2>/dev/null || echo "  (无)"

          echo ""
          echo "############################################################"
          echo "# 修复后：kernel_compat.h 相关片段"
          echo "############################################################"
          find drivers/kernelsu -name 'kernel_compat.h' 2>/dev/null | head -3 | while read f; do
            echo "--- $f (行 80-110) ---"
            sed -n '80,110p' "$f" | cat -n
          done

      - name: Patch defconfig
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          {
            echo ""
            echo "# ===== CI 注入 ====="
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBES_HOOK=y"
            echo "# CONFIG_ARM64_LSE_ATOMICS is not set"
          } >> "$DEFCONFIG_FILE"
          tail -10 "$DEFCONFIG_FILE"

      # ── 编译 ─────────────────────────────────────────────
      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          LOG=${{ github.workspace }}/compile.log

          echo "===== [1/3] 清理 out =====" | tee $LOG
          rm -rf out

          echo "===== [2/3] defconfig =====" | tee -a $LOG
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 | tee -a $LOG || {
            echo "❌ defconfig 失败"; exit 1;
          }

          echo "===== [3/3] 编译内核 =====" | tee -a $LOG
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tee -a $LOG
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ 编译失败 (exit=$STATUS)" | tee -a $LOG
            exit 1
          fi
          echo "✓ 编译成功" | tee -a $LOG

      - name: Print errors on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "############################################################"
          echo "#   编译失败，请复制以下全部内容发给我                      #"
          echo "############################################################"
          echo ""
          echo "============================================================"
          echo "  [1/4] 所有 error 行（前 100 条）"
          echo "============================================================"
          grep -i "error:" ${{ github.workspace }}/compile.log | head -100 || echo "(无)"
          echo ""
          echo "============================================================"
          echo "  [2/4] 编译日志最后 300 行"
          echo "============================================================"
          tail -300 ${{ github.workspace }}/compile.log || true
          echo ""
          echo "============================================================"
          echo "  [3/4] 修复后的 kernel_compat.h（前 120 行）"
          echo "============================================================"
          find kernel/drivers/kernelsu -name 'kernel_compat.h' -exec cat -n {} \; 2>/dev/null | head -120 || \
            find kernel/KernelSU-Next -name 'kernel_compat.h' -exec cat -n {} \; 2>/dev/null | head -120 || \
            echo "(未找到 kernel_compat.h)"
          echo ""
          echo "============================================================"
          echo "  [4/4] strscpy_pad 残留检查"
          echo "============================================================"
          grep -rn "strscpy_pad" kernel/drivers/kernelsu/ kernel/KernelSU-Next/ 2>/dev/null | head -50 || echo "(无)"
          echo ""
          echo "############################################################"
          echo "#   诊断结束"
          echo "############################################################"
          exit 1

      # ── 打包 ─────────────────────────────────────────────
      - name: Collect artifacts
        if: always()
        run: |
          echo "=== boot 目录 ==="
          ls -la kernel/out/arch/arm64/boot/ 2>&1 || true

      - name: Package AnyKernel3
        if: steps.compile.outcome == 'success'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=kebab
          device.name2=instantnoodle
          device.name3=instantnoodlep
          supported.versions=
          supported.patchlevels=
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          EOF
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          if [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/dtb
          else
            mkdir -p AnyKernel3/dtb
            find kernel/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} AnyKernel3/dtb/ \;
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi
          ls -la AnyKernel3/
          cd AnyKernel3 && zip -r9 ../AnyKernel3-pdrm00.zip . -x '*.git*'

      - name: Upload AnyKernel3 zip
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-pdrm00
          path: AnyKernel3-pdrm00.zip
          if-no-files-found: error

      - name: Upload raw Image
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-Image-pdrm00
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload dtbo
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-pdrm00
          path: kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
