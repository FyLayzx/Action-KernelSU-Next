name: test

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 内核源码分支
        required: false
        default: 'OOS13.1'
      KERNEL_CONFIG:
        description: defconfig 名称
        required: true
        default: kona-perf_defconfig
      KSUNEXT_ENABLED:
        description: 启用 KernelSU-Next
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/FyLayzx/kernel_oneplus_sm8250

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev zip curl wget \
            python3 python-is-python3 cpio lz4 xz-utils ccache \
            android-sdk-libsparse-utils patch

      - name: Download AOSP Clang
        run: |
          set -e
          URL1="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr1-s2-release/clang-r450784e.tar.gz"
          URL2="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20240212-release/Clang-14.0.6-20240212.tar.gz"
          if ! wget -q "$URL1" -O clang.tar.gz; then
            echo "官方源失败，切换备用源"
            wget -q "$URL2" -O clang.tar.gz
          fi
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          echo "CLANG_PATH=$PWD/clang/bin" >> "$GITHUB_ENV"
          $PWD/clang/bin/clang --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-pdrm00
          restore-keys: ccache-pdrm00-

      - name: Clone kernel source
        run: |
          git clone ${{ env.KERNEL_REPO }} kernel \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} --depth=1

      - name: Locate defconfig
        run: |
          DEFCONFIG_INPUT="${{ github.event.inputs.KERNEL_CONFIG }}"
          if [ -f "kernel/arch/arm64/configs/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          elif [ -f "kernel/arch/arm64/configs/vendor/$DEFCONFIG_INPUT" ]; then
            echo "DEFCONFIG=vendor/$DEFCONFIG_INPUT" >> "$GITHUB_ENV"
          else
            echo "✗ 未找到 $DEFCONFIG_INPUT"
            find kernel/arch/arm64/configs -name '*defconfig*'
            exit 1
          fi
          echo "✓ defconfig: $DEFCONFIG"

      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          ls -la drivers/kernelsu/ | head -10

      # ============================================================
      # 【新增】修复 strscpy_pad 命名不匹配
      # ============================================================
      - name: Fix strscpy_pad → __strscpy_pad
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          echo "############################################################"
          echo "# 修复前：kernel_compat.h 第 80-110 行"
          echo "############################################################"
          sed -n '80,110p' drivers/kernelsu/compat/kernel_compat.h | cat -n

          echo ""
          echo "############################################################"
          echo "# 步骤 1: 删除（注释掉）KernelSU-Next 自定义的 __strscpy_pad 函数"
          echo "# 原因: 内核已有 __strscpy_pad，重复定义会导致冲突"
          echo "############################################################"
          sed -i '/static inline ssize_t __strscpy_pad/,/^}/ s/^/\/\/ KSU-CI-DISABLED: /' \
            drivers/kernelsu/compat/kernel_compat.h

          echo ""
          echo "############################################################"
          echo "# 步骤 2: 把 kernelsu 目录下所有 strscpy_pad 替换为 __strscpy_pad"
          echo "# \b 保证不会误伤 __strscpy_pad（前面是下划线）"
          echo "############################################################"
          find drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \) -print0 | \
            xargs -0 sed -i 's/\bstrscpy_pad\b/__strscpy_pad/g'

          echo ""
          echo "############################################################"
          echo "# 修复后：kernel_compat.h 第 80-110 行"
          echo "############################################################"
          sed -n '80,110p' drivers/kernelsu/compat/kernel_compat.h | cat -n

          echo ""
          echo "############################################################"
          echo "# 剩余 strscpy_pad 引用（应全部是 __strscpy_pad）"
          echo "############################################################"
          grep -rn "strscpy_pad" drivers/kernelsu/ | head -30

      - name: Patch defconfig
        if: ${{ github.event.inputs.KSUNEXT_ENABLED == 'true' }}
        run: |
          cd kernel
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          {
            echo ""
            echo "# ===== CI 注入 ====="
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBES_HOOK=y"
            echo "# CONFIG_ARM64_LSE_ATOMICS is not set"
          } >> "$DEFCONFIG_FILE"
          tail -10 "$DEFCONFIG_FILE"

      - name: Compile kernel
        id: compile
        continue-on-error: true
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          set -o pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          LOG=${{ github.workspace }}/compile.log

          echo "===== [1/3] 清理 out =====" | tee $LOG
          rm -rf out

          echo "===== [2/3] defconfig =====" | tee -a $LOG
          make O=out ARCH=arm64 CC="ccache clang" ${{ env.DEFCONFIG }} 2>&1 | tee -a $LOG || {
            echo "❌ defconfig 失败"; exit 1;
          }

          echo "===== [3/3] 编译内核 =====" | tee -a $LOG
          make O=out ARCH=arm64 -j$(nproc) \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 2>&1 | tee -a $LOG
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ 编译失败 (exit=$STATUS)" | tee -a $LOG
            exit 1
          fi
          echo "✓ 编译成功" | tee -a $LOG

      - name: Print all diagnostics on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "############################################################"
          echo "#   编译失败，请复制以下全部内容                            #"
          echo "############################################################"
          echo ""
          echo "============================================================"
          echo "  [1/4] 所有 error 行"
          echo "============================================================"
          grep -i "error:" ${{ github.workspace }}/compile.log | head -100 || echo "(无)"
          echo ""
          echo "============================================================"
          echo "  [2/4] 编译日志最后 300 行"
          echo "============================================================"
          tail -300 ${{ github.workspace }}/compile.log || true
          echo ""
          echo "============================================================"
          echo "  [3/4] 修复后的 kernel_compat.h（第 1-120 行）"
          echo "============================================================"
          sed -n '1,120p' kernel/drivers/kernelsu/compat/kernel_compat.h | cat -n
          echo ""
          echo "============================================================"
          echo "  [4/4] kernelsu 里所有 strscpy_pad 出现位置"
          echo "============================================================"
          grep -rn "strscpy_pad" kernel/drivers/kernelsu/ || echo "(无)"
          echo ""
          echo "############################################################"
          echo "#   诊断结束"
          echo "############################################################"
          exit 1

      - name: Collect artifacts
        if: always()
        run: |
          echo "=== boot 目录 ==="
          ls -la kernel/out/arch/arm64/boot/ 2>&1 || true
